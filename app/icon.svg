<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="My Finance">
  <!--
    The app mark: an F whose two arms are chart bars of unequal length, set on
    the same near-black used for actions. The bars are notched off the stem and
    fully rounded so they read as bars at size; at 16px the notch closes and it
    is simply a bold F, which is the one thing it must never stop being.
  -->
  <rect width="32" height="32" rx="7" fill="#17171c"/>
  <g fill="#ffffff">
    <rect x="9" y="7" width="4.5" height="18" rx="1.5"/>
    <rect x="14.5" y="7" width="8.5" height="4.5" rx="2.25"/>
    <rect x="14.5" y="14.25" width="6" height="4.5" rx="2.25"/>
  </g>
</svg>
